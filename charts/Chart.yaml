apiVersion: v2
name: fun-with-minikube
description: Umbrella chart for the local fun-with-minikube setup (podinfo, VictoriaMetrics, VictoriaLogs, OpenTelemetry Collector).
type: application
version: 0.1.0

dependencies:
  - name: podinfo
    alias: podinfo
    version: 6.15.0
    repository: https://stefanprodan.github.io/podinfo
    condition: podinfo.enabled
  - name: victoria-metrics-k8s-stack
    alias: vmks
    version: 0.96.0
    repository: https://victoriametrics.github.io/helm-charts/
    condition: vmks.enabled
  - name: victoria-logs-single
    alias: vls
    version: 0.13.10
    repository: https://victoriametrics.github.io/helm-charts/
    condition: vls.enabled
  - name: opentelemetry-collector
    alias: otel
    version: 0.176.1
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: otel.enabled
