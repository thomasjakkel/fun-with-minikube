# OpenTelemetry Collector as a DaemonSet: tails container logs on every node, adds Kubernetes
# metadata and ships them to VictoriaLogs (release `vls`, see victoria-logs/values.yaml).

mode: daemonset

image:
  repository: otel/opentelemetry-collector-k8s

presets:
  # filelog receiver on /var/log/pods, added to the logs pipeline.
  logsCollection:
    enabled: true
  # k8sattributes processor: k8s.namespace.name, k8s.pod.name, k8s.container.name, ...
  kubernetesAttributes:
    enabled: true

config:
  exporters:
    otlphttp/victorialogs:
      logs_endpoint: http://vls-victoria-logs-single-server.monitoring.svc:9428/insert/opentelemetry/v1/logs
  # Logs only: drop the default receivers and pipelines for traces/metrics.
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
  service:
    pipelines:
      logs:
        exporters:
          - otlphttp/victorialogs
      metrics: null
      traces: null

ports:
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 200Mi
