apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  dependsOn:
    - name: vls
  chart:
    spec:
      chart: opentelemetry-collector
      # Auto release: newest chart below 1.0.0 (Chart.yaml previously pinned 0.176.1).
      version: ">=0.176.1 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    nameOverride: opentelemetry-collector
    fullnameOverride: otel-opentelemetry-collector

    mode: daemonset

    image:
      repository: otel/opentelemetry-collector-k8s

    presets:
      # filelog receiver on /var/log/pods, added to the logs pipeline.
      logsCollection:
        enabled: true
      # k8sattributes processor: k8s.namespace.name, k8s.pod.name, k8s.container.name, ...
      kubernetesAttributes:
        enabled: true

    extraEnvs:
      - name: VICTORIALOGS_URL
        value: http://vls-victoria-logs-single-server.monitoring.svc:9428

    # Logs only. `alternateConfig` replaces the chart's default `config` (traces/metrics pipelines,
    # jaeger/zipkin/prometheus receivers). The presets above are still injected into it.
    alternateConfig:
      exporters:
        otlphttp/victorialogs:
          logs_endpoint: ${env:VICTORIALOGS_URL}/insert/opentelemetry/v1/logs
      extensions:
        health_check:
          endpoint: ${env:MY_POD_IP}:13133
      processors:
        batch: {}
        memory_limiter:
          check_interval: 5s
          limit_percentage: 80
          spike_limit_percentage: 25
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: ${env:MY_POD_IP}:4317
            http:
              endpoint: ${env:MY_POD_IP}:4318
      service:
        telemetry:
          resource:
            k8s.namespace.name: ${env:OTEL_K8S_NAMESPACE}
            k8s.node.name: ${env:OTEL_K8S_NODE_NAME}
            k8s.node.ip: ${env:OTEL_K8S_NODE_IP}
            k8s.pod.name: ${env:OTEL_K8S_POD_NAME}
            k8s.pod.ip: ${env:OTEL_K8S_POD_IP}
            host.name: ${env:OTEL_K8S_NODE_NAME}
          metrics:
            readers:
              - pull:
                  exporter:
                    prometheus:
                      host: ${env:MY_POD_IP}
                      port: 8888
        extensions:
          - health_check
        pipelines:
          logs:
            exporters:
              - otlphttp/victorialogs
            processors:
              - memory_limiter
              - batch
            receivers:
              - otlp

    ports:
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 200Mi
