apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vls
  namespace: monitoring
spec:
  interval: 30m
  timeout: 10m
  # server.vmServiceScrape needs the VictoriaMetrics CRDs installed by vmks.
  dependsOn:
    - name: vmks
  chart:
    spec:
      chart: victoria-logs-single
      # Auto release: newest chart below 1.0.0 (Chart.yaml previously pinned 0.13.10).
      version: ">=0.13.10 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    nameOverride: victoria-logs-single
    fullnameOverride: vls-victoria-logs-single

    server:
      retentionPeriod: 7d
      persistentVolume:
        enabled: true
        storageClassName: local-path
        size: 5Gi
      nodeSelector:
        kubernetes.io/hostname: fun-with-minikube-m02
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      # Self-monitoring: the vmks VMAgent (selectAllByDefault) scrapes VictoriaLogs' /metrics.
      vmServiceScrape:
        enabled: true

    # "VictoriaLogs - single-node" dashboard, loaded by the Grafana dashboard sidecar of vmks.
    dashboards:
      enabled: true
      labels:
        grafana_dashboard: "1"
