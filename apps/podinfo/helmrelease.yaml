apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: my-podinfo
  namespace: demo
spec:
  interval: 10m
  chart:
    spec:
      chart: podinfo
      # Auto release: newest 6.x chart (Chart.yaml previously pinned 6.15.0).
      version: 6.x
      sourceRef:
        kind: HelmRepository
        name: podinfo
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    fullnameOverride: my-podinfo
    logLevel: debug
