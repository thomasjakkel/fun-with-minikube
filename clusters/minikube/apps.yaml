apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  # The VMServiceScrape CRD comes from the victoria-metrics-k8s-stack release.
  dependsOn:
    - name: infrastructure
  interval: 10m
  retryInterval: 1m
  path: ./apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
